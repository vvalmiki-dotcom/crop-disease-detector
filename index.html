<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriLens AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #121212; color: #fff; padding: 15px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 15px; border: 1px solid #333; }
    h2 { font-size: 1.2rem; color: #4ade80; margin-bottom: 8px; }
    label { display: block; font-size: 0.9rem; margin-bottom: 6px; color: #aaa; }
    select { width: 100%; padding: 12px; font-size: 1rem; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 8px; margin-bottom: 12px; }
    input[type="file"] { width: 100%; padding: 10px; background: #2a2a2a; border-radius: 8px; border: 1px solid #444; color: #fff; font-size: 0.9rem; }
    img#preview { width: 100%; max-height: 200px; object-fit: contain; margin-top: 12px; border-radius: 8px; display: none; }
    button.btn { width: 100%; padding: 14px; font-size: 1rem; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; margin-top: 10px; }
    .btn-green { background: #22c55e; color: #000; }
    .btn-blue { background: #3b82f6; color: #fff; }
    .result { display: none; margin-top: 15px; padding: 12px; background: #262626; border-left: 4px solid #4ade80; border-radius: 4px; }
    .sample-btn { padding: 8px 12px; background: #333; color: #fff; border: 1px solid #555; border-radius: 6px; margin: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card">
    <h2>1. Select Language / ಭಾಷೆ</h2>
    <select id="lang">
      <option value="en-IN">English</option>
      <option value="kn-IN" selected>ಕನ್ನಡ (Kannada)</option>
      <option value="te-IN">తెలుగు (Telugu)</option>
      <option value="ta-IN">தமிழ் (Tamil)</option>
      <option value="hi-IN">हिन्दी (Hindi)</option>
      <option value="ml-IN">മലയാളം (Malayalam)</option>
      <option value="mr-IN">मराठी (Marathi)</option>
      <option value="bn-IN">বাংলা (Bengali)</option>
    </select>
  </div>

  <div class="card">
    <h2>2. Upload Leaf Photo</h2>
    <input type="file" id="filePicker" accept="image/*" />
    <img id="preview" alt="Preview" />
    <button class="btn btn-green" id="diagnoseBtn" style="display:none;" onclick="startDiagnosis()">Run Diagnosis</button>
  </div>

  <div class="card">
    <h2>Or Test Quick Samples</h2>
    <button class="sample-btn" onclick="testSample(0)">Tomato</button>
    <button class="sample-btn" onclick="testSample(1)">Potato</button>
    <button class="sample-btn" onclick="testSample(2)">Corn</button>
  </div>

  <div class="result" id="resultCard">
    <h3 id="resCrop" style="color:#4ade80;"></h3>
    <p id="resDisease" style="margin: 6px 0; font-weight: bold;"></p>
    <p id="resAdvice" style="color: #ddd; font-size: 0.95rem; line-height: 1.4;"></p>
    <button class="btn btn-blue" id="speakBtn" onclick="speakAdvice()">🔊 Listen Solution</button>
  </div>

          'hi-IN': "आलू में पछेती झुलसा रोग है। तुरंत
