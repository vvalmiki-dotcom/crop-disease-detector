<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriLens AI - Voice Leaf Scanner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d1117; color: #f0f6fc; padding: 14px; min-height: 100vh; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; margin-bottom: 12px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.15rem; color: #fff; }
    .logo-badge { background: #238636; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    .terminal-tag { display: inline-block; background: #0f2d1e; color: #3fb950; border: 1px solid #238636; padding: 3px 8px; border-radius: 12px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 8px; }
    h1 { font-size: 1.45rem; font-weight: 800; line-height: 1.25; margin-bottom: 6px; }
    p.subtitle { color: #8b949e; font-size: 0.82rem; line-height: 1.4; margin-bottom: 14px; }
    
    .lang-card { background: #161b22; border: 2px solid #238636; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
    .lang-title { font-size: 0.9rem; font-weight: 700; color: #3fb950; margin-bottom: 4px; }
    .lang-subtitle { font-size: 0.75rem; color: #8b949e; margin-bottom: 10px; }
    .lang-select-box { width: 100%; padding: 12px; border-radius: 8px; background: #0d1117; border: 1px solid #30363d; color: #f0f6fc; font-size: 0.95rem; font-weight: 600; outline: none; cursor: pointer; }
    .lang-select-box:focus { border-color: #3fb950; }

    .scanner-card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 14px; margin-bottom: 14px; }
    
    .upload-btn-container { margin-bottom: 12px; }
    .file-input { display: none; }
    .custom-upload-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #238636; border-radius: 12px; background: #0d1117; padding: 22px 12px; cursor: pointer; text-align: center; }
    .custom-upload-btn:active { background: #161b22; }
    .camera-icon { background: #1f3b2b; width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #3fb950; margin-bottom: 8px; }
    .drop-text { font-size: 0.9rem; font-weight: 600; color: #f0f6fc; margin-bottom: 4px; }
    .drop-sub { font-size: 0.75rem; color: #8b949e; }
    
    #previewImg { width: 100%; max-height: 220px; object-fit: contain; border-radius: 8px; display: none; margin-top: 12px; }

    .diagnose-btn { display: none; width: 100%; background: #238636; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; margin-top: 12px; cursor: pointer; }
    
    .result-box { display: none; background: #0d1117; border: 1px solid #238636; border-radius: 12px; padding: 14px; margin-top: 14px; }
    .res-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge { background: #3fb950; color: #0d1117; font-weight: 700; font-size: 0.72rem; padding: 3px 8px; border-radius: 10px; }
    .remedy { background: #161b22; border-left: 3px solid #3fb950; padding: 10px; border-radius: 6px; margin: 10px 0; font-size: 0.82rem; line-height: 1.4; color: #c9d1d9; }
    
    .voice-btn { width: 100%; background: #1f6feb; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 0.88rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .voice-btn:hover { background: #388bfd; }
    .voice-btn.speaking { background: #da3633; }

    .samples-header { font-size: 0.72rem; font-weight: 700; color: #8b949e; letter-spacing: 0.5px; margin: 16px 0 8px; text-transform: uppercase; }
    .samples-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .sample-card { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 6px; text-align: center; cursor: pointer; }
    .sample-img { width: 100%; height: 50px; border-radius: 4px; object-fit: cover; margin-bottom: 4px; background: #21262d; }
    .sample-title { font-size: 0.72rem; font-weight: 600; line-height: 1.2; margin-bottom: 2px; }
    .sample-tag { font-size: 0.62rem; color: #f85149; font-weight: 600; }
    .sample-tag.healthy { color: #3fb950; }
  </style>
</head>

      <div class="brand">
        <div class="logo-badge">🌿</div>
        <div>AgriLens <span style="font-size:0.68rem; background:#1f3b2b; color:#3fb950; padding:2px 6px; border-radius:4px;">AI VOICE</span></div>
      </div>
    </div>

    <div class="lang-card">
